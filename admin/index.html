able{width:100%;border-collapse:collapse;min-width:650px}th{text-align:left;color:#8f8981;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;padding:11px 9px;border-bottom:1px solid var(--line)}td{padding:12px 9px;border-bottom:1px solid #292929;color:#e9e5df}tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:4px 8px;border:1px solid #45413a;border-radius:99px;color:#d8c7ac;font-size:11px;text-transform:capitalize}.empty{padding:30px;text-align:center;color:var(--muted)}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:22px}.login{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px}.login h1{font:400 30px Georgia,serif;margin:8px 0}.field{display:block;margin:14px 0}.field span{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;background:#101010;border:1px solid var(--line);border-radius:7px;padding:11px;color:var(--text);outline:none}.field textarea{min-height:80px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}.error{color:var(--red);font-size:12px;min-height:18px;margin:10px 0}.notice{color:var(--muted);font-size:12px;margin-top:18px}.modal-backdrop{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:5}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:22px}.modal h2{font:400 24px Georgia,serif;margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.toast{padding:11px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:15px;color:var(--green)}.status-select{background:#111;color:#eee;border:1px solid #444;padding:6px;border-radius:6px}.mobile-top{display:none}

<div id="loginView" class="login-wrap"><form id="loginForm" class="login"><div class="eyebrow">Private workspace</div><h1>Studio Admin</h1><p class="muted">Sign in to manage your studio.</p><label class="field"><span>Email address</span><input id="email" type="email" autocomplete="username" required value="amr.ahmed39200@gmail.com"></label><label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary" style="width:100%" id="loginBtn">Sign in</button><div class="error" id="loginError" role="alert"></div><p class="notice">Private access only. Registration is disabled.</p></form></div>

<script>
const SUPABASE_URL="https://dglthsfxatckgtwdedir.supabase.co";
const SUPABASE_KEY="sb_publishable_rFbxDp-FGKrdN7AmiDF4Ug_FpXUFNN5";
const ADMIN_EMAIL="amr.ahmed39200@gmail.com";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let currentPage="overview",cache={leads:[],clients:[],projects:[],tasks:[],payments:[]};
const labels={overview:"Overview",leads:"Inquiries",clients:"Clients",projects:"Projects",tasks:"Tasks",payments:"Payments"};
const esc=v=>String(v??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate=v=>v?new Date(v).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"—";
const options=(values,current)=>values.map(v=>'<option value="'+esc(v[0])+'" '+(v[0]===current?'selected':'')+'>'+esc(v[1])+'</option>').join("");
function toast(msg){$("toast").textContent=msg;$("toast").classList.remove("hidden");setTimeout(()=> $("toast").classList.add("hidden"),4500)}
function showLogin(){$("appView").classList.add("hidden");$("loginView").classList.remove("hidden")}
function showApp(){$("loginView").classList.add("hidden");$("appView").classList.remove("hidden")}
async function loadAll(){const names=["leads","clients","projects","tasks","payments"];const results=await Promise.all(names.map(t=>db.from(t).select("*").order("created_at",{ascending:false}).limit(200)));for(let i=0;i<names.length;i++){if(results[i].error)throw results[i].error;cache[names[i]]=results[i].data||[]}render()}
function stat(label,value){return '<div class="stat"><span>'+label+'</span><strong>'+value+'</strong></div>'}
function table(rows,cols){if(!rows.length)return '<div class="empty">No records yet. Use the button above to add your first record.</div>';return '<div class="table-wrap"><table><thead><tr>'+cols.map(c=>'<th>'+c.label+'</th>').join("")+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+(c.render?c.render(r):esc(r[c.key]))+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>'}
function statusControl(tableName,r,values){return '<select class="status-select" data-status-table="'+tableName+'" data-id="'+r.id+'">'+options(values.map(v=>[v,v.replaceAll("_"," ")]),r.status)+'</select>'}
function render(){const {leads,clients,projects,tasks,payments}=cache;$("pageTitle").textContent=labels[currentPage];let html="";
if(currentPage==="overview"){
 const activeProjects=projects.filter(x=>!["completed","cancelled"].includes(x.status));
 const booked=projects.filter(x=>x.status!=="cancelled").reduce((s,x)=>s+Number(x.total_amount||0),0);
 const received=payments.filter(x=>x.status==="paid").reduce((s,x)=>s+Number(x.amount||0),0);
 const outstanding=payments.filter(x=>["pending","overdue"].includes(x.status)).reduce((s,x)=>s+Number(x.amount||0),0);
 const now=new Date();const monthStart=new Date(now.getFullYear(),now.getMonth(),1);
 const monthReceived=payments.filter(x=>x.status==="paid"&&x.paid_at&&new Date(x.paid_at)>=monthStart).reduce((s,x)=>s+Number(x.amount||0),0);
 const overdueTasks=tasks.filter(x=>x.status!=="done"&&x.due_date&&new Date(x.due_date+"T23:59:59")<now).length;
 const pendingTasks=tasks.filter(x=>x.status!=="done").length;
 const doneTasks=tasks.filter(x=>x.status==="done").length;
 const taskProgress=tasks.length?Math.round(doneTasks/tasks.length*100):0;
 const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:2}).format(n);
 const projectRows=activeProjects.slice().sort((a,b)=>(a.due_date||"9999").localeCompare(b.due_date||"9999")).slice(0,6);
 const paymentRows=payments.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,6);
 html='<div class="eyebrow" style="margin-bottom:12px">Business snapshot</div><div class="grid">'+stat("Total contracted",money(booked))+stat("Money received",money(received))+stat("Still to collect",money(outstanding))+stat("Received this month",money(monthReceived))+'</div><div class="grid">'+stat("Active projects",activeProjects.length)+stat("Completed projects",projects.filter(x=>x.status==="completed").length)+stat("Active clients",clients.filter(x=>x.status==="active").length)+stat("New inquiries",leads.filter(x=>x.status==="new").length)+'</div><section class="section"><div class="section-head"><h2>Work progress</h2><span class="muted">'+doneTasks+' of '+tasks.length+' tasks completed</span></div><div style="height:9px;background:#303030;border-radius:20px;overflow:hidden;margin:16px 0 9px"><div style="height:100%;width:'+taskProgress+'%;background:var(--gold);border-radius:20px"></div></div><div class="muted">'+taskProgress+'% complete · '+pendingTasks+' tasks remaining · '+overdueTasks+' overdue</div></section><section class="section"><div class="section-head"><h2>Upcoming & active projects</h2><button class="btn" data-go="projects">All projects</button></div>'+table(projectRows,[{label:"Project",key:"name"},{label:"Client",render:r=>esc(clients.find(x=>x.id===r.client_id)?.name||"—")},{label:"Status",render:r=>'<span class="pill">'+esc(r.status.replaceAll("_"," "))+'</span>'},{label:"Delivery",render:r=>fmtDate(r.due_date)},{label:"Value",render:r=>money(Number(r.total_amount||0))}])+'</section><section class="section"><div class="section-head"><h2>Recent payments</h2><button class="btn" data-go="payments">All payments</button></div>'+table(paymentRows,[{label:"Description",render:r=>esc(r.description||r.payment_type)},{label:"Project",render:r=>esc(projects.find(p=>p.id===r.project_id)?.name||"—")},{label:"Amount",render:r=>money(Number(r.amount||0))},{label:"Status",render:r=>'<span class="pill">'+esc(r.status)+'</span>'},{label:"Paid date",render:r=>fmtDate(r.paid_at)}])+'</section><section class="section"><div class="section-head"><h2>Recent inquiries</h2><button class="btn" data-go="leads">View all</button></div>'+table(leads.slice(0,5),[{label:"Client",key:"name"},{label:"Service",key:"service"},{label:"Received",render:r=>fmtDate(r.created_at)},{label:"Status",render:r=>'<span class="pill">'+esc(r.status)+'</span>'}])+'</section>';
}
else{const cfg={
leads:{rows:leads,cols:[{label:"Name",key:"name"},{label:"Email",key:"email"},{label:"Company",key:"company"},{label:"Service",key:"service"},{label:"Budget",key:"budget"},{label:"Received",render:r=>fmtDate(r.created_at)},{label:"Status",render:r=>statusControl("leads",r,["new","contacted","quoted","negotiating","won","lost"])},{label:"Next step",render:r=>r.client_id?'<span class="pill">Client created</span>':'<button class="btn primary" data-convert="' + esc(r.id) + '">Accept & set up</button>'}]},
clients:{rows:clients,cols:[{label:"Name",key:"name"},{label:"Company",key:"company"},{label:"Email",key:"email"},{label:"Country",key:"country"},{label:"Status",render:r=>'<span class="pill">'+esc(r.status)+'</span>'},{label:"Actions",render:r=>'<button class="btn danger" data-delete-client="'+esc(r.id)+'">Delete</button>'}]},
projects:{rows:projects,cols:[{label:"Project",key:"name"},{label:"Client",render:r=>esc(clients.find(c=>c.id===r.client_id)?.name||"—")},{label:"Service",key:"service"},{label:"Status",render:r=>statusControl("projects",r,["planning","in_progress","review","completed","on_hold","cancelled"])},{label:"Due date",render:r=>fmtDate(r.due_date)},{label:"Value",render:r=>esc(r.currency)+" "+esc(r.total_amount)}]},
tasks:{rows:tasks,cols:[{label:"Task",key:"title"},{label:"Project",render:r=>esc(projects.find(p=>p.id===r.project_id)?.name||"—")},{label:"Priority",key:"priority"},{label:"Status",render:r=>statusControl("tasks",r,["todo","in_progress","done"])},{label:"Due date",render:r=>fmtDate(r.due_date)}]},
payments:{rows:payments,cols:[{label:"Description",render:r=>esc(r.description||r.payment_type)},{label:"Project",render:r=>esc(projects.find(p=>p.id===r.project_id)?.name||"—")},{label:"Amount",render:r=>esc(r.currency)+" "+esc(r.amount)},{label:"Type",key:"payment_type"},{label:"Status",render:r=>statusControl("payments",r,["pending","paid","overdue","cancelled"])},{label:"Due date",render:r=>fmtDate(r.due_date)}]}
};const c=cfg[currentPage];html='<section class="section"><div class="section-head"><h2>'+labels[currentPage]+'</h2><div><span class="muted" style="margin-right:12px">'+c.rows.length+' records</span><button class="btn primary" id="addBtn">+ Add '+labels[currentPage].replace(/s$/,"").replace("Inquirie","Inquiry")+'</button></div></div>'+table(c.rows,c.cols)+'</section>';}
$("content").innerHTML=html;
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
document.querySelectorAll("[data-status-table]").forEach(s=>s.addEventListener("change",()=>updateStatus(s)));
document.querySelectorAll("[data-convert]").forEach(b=>b.addEventListener("click",()=>openConvert(b.dataset.convert)));
document.querySelectorAll("[data-delete-client]").forEach(b=>b.addEventListener("click",()=>deleteClient(b.dataset.deleteClient)));
const add=$("addBtn");if(add)add.addEventListener("click",()=>openAdd(currentPage));
}

function openConvert(leadId){
 const lead=cache.leads.find(x=>x.id===leadId);if(!lead)return;
 const existing=cache.clients.find(x=>(x.email||"").toLowerCase()===(lead.email||"").toLowerCase());
 const suggested=(lead.company||lead.name||"Client")+" — "+(lead.service||"Project");
 $("modalRoot").innerHTML='<div class="modal-backdrop" id="convertBackdrop"><form class="modal" id="convertForm"><div class="section-head"><h2>Accept inquiry & set up project</h2><button type="button" class="btn" id="convertClose">Close</button></div><p class="muted">Client details will be copied from the inquiry. You only need to confirm the agreed project details.</p><div class="form-grid"><label class="field"><span>Client</span><input value="'+esc(lead.name)+'" disabled></label><label class="field"><span>Email</span><input value="'+esc(lead.email)+'" disabled></label><label class="field"><span>Project name *</span><input name="project_name" required value="'+esc(suggested)+'"></label><label class="field"><span>Agreed price (USD) *</span><input name="amount" type="number" min="0.01" step="0.01" required placeholder="Enter agreed amount"></label><label class="field"><span>Start date</span><input name="start_date" type="date"></label><label class="field"><span>Delivery date</span><input name="due_date" type="date"></label><label class="field" style="grid-column:1/-1"><span>Agreed scope / important notes</span><textarea name="scope" placeholder="What exactly did you agree to deliver?"></textarea></label></div><p class="muted">The system will create the client and project, prepare two 50% payment records (both initially pending), and add a starter task checklist. No payment will be marked as received automatically.</p><div class="error" id="convertError"></div><div class="modal-actions"><button type="button" class="btn" id="convertCancel">Cancel</button><button class="btn primary" id="convertSave">Create client & project</button></div></form></div>';
 const close=()=> $("modalRoot").innerHTML="";$("convertClose").onclick=$("convertCancel").onclick=close;
 $("convertBackdrop").addEventListener("click",e=>{if(e.target.id==="convertBackdrop")close()});
 $("convertForm").addEventListener("submit",async e=>{
  e.preventDefault();const btn=$("convertSave");btn.disabled=true;btn.textContent="Setting up…";const fd=new FormData(e.currentTarget);const v=Object.fromEntries(fd.entries());let clientId=existing?.id||null;
  try{
   if(!clientId){const {data,error}=await db.from("clients").insert({name:lead.name,email:lead.email,company:lead.company||null,phone:lead.phone||null,notes:"Created from website inquiry. "+(lead.project_details||lead.message||"") ,status:"active"}).select().single();if(error)throw error;clientId=data.id;}
   const amount=Number(v.amount);let project=cache.projects.find(p=>p.lead_id===lead.id)||null;
   if(!project){const {data,error:projectError}=await db.from("projects").insert({client_id:clientId,lead_id:lead.id,name:v.project_name,service:lead.service||"Other",status:"planning",start_date:v.start_date||null,due_date:v.due_date||null,total_amount:amount,currency:"USD",notes:v.scope||lead.project_details||lead.message||null,description:v.scope||lead.project_details||lead.message||null}).select().single();if(projectError)throw projectError;project=data;}
   const {data:existingPayments,error:checkPaymentsError}=await db.from("payments").select("id").eq("project_id",project.id);if(checkPaymentsError)throw checkPaymentsError;
   if(!existingPayments?.length){const half=Math.round(amount*50)/100;const {error:payError}=await db.from("payments").insert([{project_id:project.id,client_id:clientId,amount:half,currency:"USD",payment_type:"deposit",status:"pending",description:"50% upfront deposit"},{project_id:project.id,client_id:clientId,amount:Math.round((amount-half)*100)/100,currency:"USD",payment_type:"final",status:"pending",due_date:v.due_date||null,description:"50% final payment"}]);if(payError)throw payError;}
   const {data:existingTasks,error:checkTasksError}=await db.from("tasks").select("id").eq("project_id",project.id);if(checkTasksError)throw checkTasksError;
   if(!existingTasks?.length){const starter=["Review brief & references","Develop initial concepts","Client feedback & revisions","Prepare and deliver final files"];const {error:taskError}=await db.from("tasks").insert(starter.map((title,i)=>({project_id:project.id,title,status:"todo",priority:i===0?"high":"normal",description:"Starter task — adjust to the agreed project scope."})));if(taskError)throw taskError;}
   const {error:leadError}=await db.from("leads").update({status:"won",client_id:clientId,updated_at:new Date().toISOString()}).eq("id",lead.id);if(leadError)throw leadError;
   await logActivity("inquiry_converted","Accepted inquiry and created client, project, payment schedule and starter tasks",{lead_id:lead.id,client_id:clientId,project_id:project.id});
   close();await loadAll();go("overview");toast("Client and project set up. Review the payment dates and task list.");
  }catch(err){$("convertError").textContent="Setup stopped: "+(err.message||"Unknown error")+". Some records may already have been created; check Clients, Projects, Payments and Tasks before trying again.";btn.disabled=false;btn.textContent="Retry setup";}
 });
}
function go(page){currentPage=page;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));render()}
async function logActivity(type,description,ids={}){const {error}=await db.from("activities").insert({activity_type:type,description,...ids});if(error)console.warn("Activity log:",error.message)}
async function deleteClient(clientId){
 const client=cache.clients.find(c=>c.id===clientId);if(!client)return;
 const label=client.name||client.email||"this client";
 const confirmed=confirm("PERMANENTLY DELETE "+label+"?\n\nThis will delete ALL records belonging to this client, including their inquiries, projects, tasks, payments and related activity history. This cannot be undone.");
 if(!confirmed)return;
 const button=document.querySelector('[data-delete-client="'+CSS.escape(clientId)+'"]');if(button){button.disabled=true;button.textContent="Deleting…"}
 const {data,error}=await db.from("clients").delete().eq("id",clientId).select("id").maybeSingle();
 if(error){if(button){button.disabled=false;button.textContent="Delete"}alert("Could not delete client: "+error.message);return}
 if(!data){alert("No client was deleted. Check your admin access and try again.");await loadAll();return}
 await loadAll();toast("Client and all related records were permanently deleted.");
}
async function updateStatus(el){el.disabled=true;const tableName=el.dataset.statusTable;const changes={status:el.value,updated_at:new Date().toISOString()};if(tableName==="payments")changes.paid_at=el.value==="paid"?new Date().toISOString():null;const {error}=await db.from(tableName).update(changes).eq("id",el.dataset.id);el.disabled=false;if(error){alert("Update failed: "+error.message);return}await logActivity("status_updated",tableName+" status changed to "+el.value,tableName==="leads"?{lead_id:el.dataset.id}:{});await loadAll();toast("Status updated.")}
function field(name,label,type="text",required=false,extra=""){return '<label class="field"><span>'+label+(required?' *':'')+'</span><input name="'+name+'" type="'+type+'" '+(required?'required':'')+' '+extra+'></label>'}
function selectField(name,label,opts,required=true){return '<label class="field"><span>'+label+(required?' *':'')+'</span><select name="'+name+'" '+(required?'required':'')+'><option value="">Choose…</option>'+opts.map(o=>'<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>').join("")+'</select></label>'}
function openAdd(page){let title="",fields="";
if(page==="clients"){title="Add client";fields=field("name","Client name","text",true)+field("email","Email","email")+field("company","Company")+field("phone","Phone")+field("country","Country")+ '<label class="field"><span>Notes</span><textarea name="notes"></textarea></label>';}
if(page==="projects"){title="Add project";fields=selectField("client_id","Client",cache.clients.map(c=>[c.id,c.name]),true)+field("name","Project name","text",true)+selectField("service","Service",[["Apparel Design","Apparel Design"],["Graphic Design","Graphic Design"],["Branding","Branding"],["Tech Packs","Tech Packs"],["Creative Direction","Creative Direction"],["Other","Other"]],false)+selectField("status","Status",["planning","in_progress","review","completed","on_hold","cancelled"].map(x=>[x,x.replaceAll("_"," ")]))+field("start_date","Start date","date")+field("due_date","Due date","date")+field("total_amount","Project value (USD)","number",false,'min="0" step="0.01"')+'<label class="field"><span>Notes</span><textarea name="notes"></textarea></label>';}
if(page==="tasks"){title="Add task";fields=selectField("project_id","Project",cache.projects.map(p=>[p.id,p.name]),true)+field("title","Task title","text",true)+selectField("priority","Priority",["low","normal","high","urgent"].map(x=>[x,x]))+selectField("status","Status",["todo","in_progress","done"].map(x=>[x,x.replaceAll("_"," ")]))+field("due_date","Due date","date")+'<label class="field"><span>Description</span><textarea name="description"></textarea></label>';}
if(page==="payments"){title="Add payment";fields=selectField("project_id","Project",cache.projects.map(p=>[p.id,p.name]),true)+selectField("client_id","Client",cache.clients.map(c=>[c.id,c.name]),false)+field("amount","Amount (USD)","number",true,'min="0" step="0.01"')+selectField("payment_type","Payment type",["deposit","installment","final","refund"].map(x=>[x,x]))+selectField("status","Status",["pending","paid","overdue","cancelled"].map(x=>[x,x]))+field("due_date","Due date","date") + field("description","Description");}
if(page==="leads"){title="Add inquiry";fields=field("name","Client name","text",true)+field("email","Email","email",true)+field("company","Company")+field("service","Service")+field("budget","Budget")+field("timeline","Timeline")+'<label class="field"><span>Project details</span><textarea name="project_details"></textarea></label>';}
if(page==="overview")return;
$("modalRoot").innerHTML='<div class="modal-backdrop" id="modalBackdrop"><form class="modal" id="addForm"><div class="section-head"><h2>'+title+'</h2><button type="button" class="btn" id="closeModal">Close</button></div><div class="form-grid">'+fields+'</div><div class="error" id="formError"></div><div class="modal-actions"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveBtn">Save record</button></div></form></div>';
$("closeModal").onclick=$("cancelModal").onclick=()=> $("modalRoot").innerHTML="";
$("modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")$("modalRoot").innerHTML=""});
$("addForm").addEventListener("submit",async e=>{e.preventDefault();const btn=$("saveBtn");btn.disabled=true;btn.textContent="Saving…";const fd=new FormData(e.currentTarget);let row=Object.fromEntries(fd.entries());for(const k of Object.keys(row))if(row[k]==="")row[k]=null;
if(page==="clients"){row.status="active"}
if(page==="projects"){row.total_amount=Number(row.total_amount||0);row.currency="USD"}
if(page==="tasks"){row.priority=row.priority||"normal";row.status=row.status||"todo"}
if(page==="payments"){row.amount=Number(row.amount);row.currency="USD";if(row.client_id===null){const p=cache.projects.find(x=>x.id===row.project_id);row.client_id=p?.client_id||null}}
const {data,error}=await db.from(page).insert(row).select().single();if(error){$("formError").textContent=error.message;btn.disabled=false;btn.textContent="Save record";return}
const idKey={leads:"lead_id",clients:"client_id",projects:"project_id",tasks:"project_id",payments:"project_id"}[page];const ids={};if(data?.id&&["leads","clients","projects"].includes(page))ids[idKey]=data.id;await logActivity("record_created","Created "+page.slice(0,-1)+" record",ids);$("modalRoot").innerHTML="";await loadAll();toast(title+" saved successfully.");});
}
$("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)});
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginBtn").disabled=true;$("loginError").textContent="Signing in…";const {data,error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});$("loginBtn").disabled=false;if(error){$("loginError").textContent=error.message;return}if((data.user?.email||"").toLowerCase()!==ADMIN_EMAIL){await db.auth.signOut();$("loginError").textContent="This account is not authorized.";return}try{showApp();await loadAll()}catch(err){$("content").textContent="Could not load records: "+err.message}});
$("logoutBtn").addEventListener("click",async()=>{await db.auth.signOut();showLogin()});
(async()=>{const {data}=await db.auth.getSession();if(data.session?.user?.email?.toLowerCase()===ADMIN_EMAIL){showApp();try{await loadAll()}catch(e){$("content").textContent=e.message}}else{if(data.session)await db.auth.signOut();showLogin()}})();
</script></body></html>
