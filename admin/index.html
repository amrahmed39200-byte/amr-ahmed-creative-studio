<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Studio Admin — Amr Ahmed</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#101010;--panel:#191919;--panel2:#202020;--line:#303030;--text:#f4f1eb;--muted:#aaa49b;--gold:#c5a477;--red:#d98a80;--green:#9fc5a7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{padding:28px 18px;border-right:1px solid var(--line);background:#141414}.brand{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:4px 10px 42px}.brand b{display:block;color:var(--text);font-size:17px;letter-spacing:.04em;margin-top:8px}.nav-label{font-size:10px;letter-spacing:.16em;color:#777;text-transform:uppercase;margin:24px 10px 10px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:8px;margin:3px 0}.nav button.active,.nav button:hover{background:#26231f;color:var(--text)}.nav button.active{box-shadow:inset 2px 0 var(--gold)}.side-foot{position:sticky;top:90vh;margin:40px 10px 0;color:#777;font-size:12px}.main{padding:34px clamp(20px,4vw,58px);min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:34px}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:.18em;text-transform:uppercase}.top h1{font:400 clamp(27px,4vw,38px)/1.1 Georgia,serif;margin:8px 0 0}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 15px;border-radius:7px}.btn.primary{background:var(--gold);color:#17130e;border-color:var(--gold);font-weight:600}.btn:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:26px}.stat,.section{background:var(--panel);border:1px solid var(--line);border-radius:12px}.stat{padding:19px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font:400 30px Georgia,serif;margin-top:12px}.section{padding:20px;margin-bottom:18px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.section h2{font:400 22px Georgia,serif;margin:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th{text-align:left;color:#8f8981;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:14px 10px;border-bottom:1px solid #292929;color:#e9e5df}tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:4px 8px;border:1px solid #45413a;border-radius:99px;color:#d8c7ac;font-size:11px;text-transform:capitalize}.empty{padding:35px;text-align:center;color:var(--muted)}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:22px}.login{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:34px}.login h1{font:400 30px Georgia,serif;margin:8px 0}.field{display:block;margin:18px 0}.field span{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.field input{width:100%;background:#101010;border:1px solid var(--line);border-radius:7px;padding:12px;color:var(--text);outline:none}.field input:focus{border-color:var(--gold)}.error{color:var(--red);font-size:12px;min-height:18px;margin:10px 0}.notice{color:var(--muted);font-size:12px;margin-top:20px}.loading{color:var(--muted);padding:24px}.mobile-top{display:none}
@media(max-width:850px){.shell{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);padding:15px 16px}.brand{margin:0 4px 12px}.brand b{display:inline;margin-left:8px}.nav{display:flex;overflow:auto;gap:4px}.nav-label,.side-foot{display:none}.nav button{white-space:nowrap;width:auto}.main{padding:24px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{align-items:flex-start}.top .btn{white-space:nowrap}}
</style>
</head>
<body>
<div id="loginView" class="login-wrap">
  <form id="loginForm" class="login">
    <div class="eyebrow">Private workspace</div>
    <h1>Studio Admin</h1>
    <p class="muted">Sign in to manage your clients, projects and inquiries.</p>
    <label class="field"><span>Email address</span><input id="email" type="email" autocomplete="username" required value=""></label>
    <label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" style="width:100%" id="loginBtn">Sign in</button>
    <div class="error" id="loginError" role="alert"></div>
    <p class="notice">Private access only. New account registration is not available here.</p>
  </form>
</div>
<div id="appView" class="shell hidden">
  <aside class="side">
    <div class="brand">AMR AHMED <b>Creative Studio</b></div>
    <div class="nav-label">Workspace</div>
    <nav class="nav" id="nav">
      <button class="active" data-page="overview">Overview</button>
      <button data-page="leads">Inquiries</button>
      <button data-page="clients">Clients</button>
      <button data-page="projects">Projects</button>
      <button data-page="tasks">Tasks</button>
      <button data-page="payments">Payments</button>
    </nav>
    <div class="side-foot">PRIVATE ADMIN AREA · 2026</div>
  </aside>
  <main class="main">
    <header class="top"><div><div class="eyebrow">Creative studio management</div><h1 id="pageTitle">Overview</h1></div><button class="btn" id="logoutBtn">Sign out</button></header>
    <div id="content"><div class="loading">Loading workspace…</div></div>
  </main>
</div>
<script>
const SUPABASE_URL = "https://dglthsfxatckgtwdedir.supabase.co";
const SUPABASE_KEY = "sb_publishable_rFbxDp-FGKrdN7AmiDF4Ug_FpXUFNN5";
const ADMIN_EMAIL = "amr.ahmed39200@gmail.com";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
let currentPage = "overview";
let cache = {leads:[],clients:[],projects:[],tasks:[],payments:[]};
const labels = {overview:"Overview",leads:"Inquiries",clients:"Clients",projects:"Projects",tasks:"Tasks",payments:"Payments"};
const fmtDate = v => v ? new Date(v).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "—";
const esc = v => String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function showLogin(){ $("appView").classList.add("hidden"); $("loginView").classList.remove("hidden"); }
function showApp(){ $("loginView").classList.add("hidden"); $("appView").classList.remove("hidden"); }
async function loadAll(){
  const tables = ["leads","clients","projects","tasks","payments"];
  const results = await Promise.all(tables.map(t=>db.from(t).select("*").order("created_at",{ascending:false}).limit(100)));
  for(let i=0;i<tables.length;i++){if(results[i].error) throw results[i].error;cache[tables[i]]=results[i].data||[];}
  render();
}
function statCard(label,value){return '<div class="stat"><span>'+label+'</span><strong>'+value+'</strong></div>'}
function tableView(rows,cols){if(!rows.length)return '<div class="empty">Nothing here yet. New records will appear here.</div>';return '<div class="table-wrap"><table><thead><tr>'+cols.map(c=>'<th>'+c.label+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+ (c.render?c.render(r):esc(r[c.key])) +'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function render(){
  $("pageTitle").textContent=labels[currentPage];
  const leads=cache.leads, clients=cache.clients, projects=cache.projects, tasks=cache.tasks, payments=cache.payments;
  if(currentPage==="overview"){
    $("content").innerHTML='<div class="grid">'+statCard("New inquiries",leads.filter(x=>x.status==="new").length)+statCard("Active clients",clients.filter(x=>x.status!=="inactive").length)+statCard("Open projects",projects.filter(x=>!["completed","cancelled"].includes(x.status)).length)+statCard("Pending payments",payments.filter(x=>x.status==="pending"||x.status==="overdue").length)+'</div><section class="section"><div class="section-head"><h2>Recent inquiries</h2><button class="btn" data-go="leads">View all</button></div>'+tableView(leads.slice(0,6),[{label:"Client",key:"name"},{label:"Service",key:"service"},{label:"Received",render:r=>fmtDate(r.created_at)},{label:"Status",render:r=>'<span class="pill">'+esc(r.status)+'</span>'}])+'</section>';
  } else {
    const config={
      leads:{rows:leads,cols:[{label:"Name",key:"name"},{label:"Email",key:"email"},{label:"Service",key:"service"},{label:"Budget",key:"budget"},{label:"Received",render:r=>fmtDate(r.created_at)},{label:"Status",render:r=>'<select aria-label="Update inquiry status" data-lead="'+r.id+'" class="status-select" style="background:#111;color:#eee;border:1px solid #444;padding:6px;border-radius:6px">'+["new","contacted","quoted","negotiating","won","lost"].map(s=>'<option '+(r.status===s?'selected':'')+'>'+s+'</option>').join("")+'</select>'}]},
      clients:{rows:clients,cols:[{label:"Name",key:"name"},{label:"Company",key:"company"},{label:"Email",key:"email"},{label:"Country",key:"country"},{label:"Status",render:r=>'<span class="pill">'+esc(r.status)+'</span>'}]},
      projects:{rows:projects,cols:[{label:"Project",key:"name"},{label:"Service",key:"service"},{label:"Status",render:r=>'<span class="pill">'+esc(r.status)+'</span>'},{label:"Due date",render:r=>fmtDate(r.due_date)},{label:"Value",render:r=>esc(r.currency||"USD")+" "+esc(r.total_amount??r.quoted_amount??0)}]},
      tasks:{rows:tasks,cols:[{label:"Task",key:"title"},{label:"Project ID",key:"project_id"},{label:"Priority",key:"priority"},{label:"Status",render:r=>'<span class="pill">'+esc(r.status)+'</span>'},{label:"Due date",render:r=>fmtDate(r.due_date)}]},
      payments:{rows:payments,cols:[{label:"Description",render:r=>r.description?esc(r.description):esc(r.payment_type)},{label:"Amount",render:r=>esc(r.currency)+" "+esc(r.amount)},{label:"Status",render:r=>'<span class="pill">'+esc(r.status)+'</span>'},{label:"Due date",render:r=>fmtDate(r.due_date)},{label:"Paid at",render:r=>fmtDate(r.paid_at)}]}
    };
    const c=config[currentPage];$("content").innerHTML='<section class="section"><div class="section-head"><h2>'+labels[currentPage]+'</h2><span class="muted">'+c.rows.length+' records</span></div>'+tableView(c.rows,c.cols)+'</section>';
  }
  document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
  document.querySelectorAll("[data-lead]").forEach(s=>s.addEventListener("change",async()=>{s.disabled=true;const {error}=await db.from("leads").update({status:s.value}).eq("id",s.dataset.lead);if(error){alert("Could not update status: "+error.message);s.disabled=false;return;}await loadAll();}));
}
function go(page){currentPage=page;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));render();}
$("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)});
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginBtn").disabled=true;$("loginError").textContent="Signing in…";const {data,error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});$("loginBtn").disabled=false;if(error){$("loginError").textContent=error.message;return;}if((data.user?.email||"").toLowerCase()!==ADMIN_EMAIL){await db.auth.signOut();$("loginError").textContent="This account is not authorized for this workspace.";return;}try{showApp();$("loginError").textContent="";await loadAll();}catch(err){$("content").innerHTML='<div class="section">Could not load records: '+esc(err.message)+'</div>'; }});
$("logoutBtn").addEventListener("click",async()=>{await db.auth.signOut();showLogin()});
(async()=>{const {data}=await db.auth.getSession();if(data.session?.user?.email?.toLowerCase()===ADMIN_EMAIL){showApp();try{await loadAll()}catch(e){$("content").textContent=e.message}}else{if(data.session)await db.auth.signOut();showLogin()}})();
</script>
</body>
</html>
